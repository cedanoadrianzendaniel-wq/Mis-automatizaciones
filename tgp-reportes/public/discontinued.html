<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio Discontinuado — TGP Reportes</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.07);
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1a1a1a;
    }
    p {
      font-size: 15px;
      line-height: 1.55;
      color: #555;
      margin-bottom: 14px;
    }
    .meta {
      font-size: 12px;
      color: #888;
      margin-top: 24px;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }
    strong { color: #333; }
  </style>
</head>
<body>
  <main class="card" role="alert" aria-live="polite">
    <div class="icon" aria-hidden="true">⚠️</div>
    <h1>Servicio Discontinuado</h1>
    <p>El sistema <strong>TGP Reportes de Campo</strong> ya no se encuentra en operación.</p>
    <p>Para cualquier consulta o continuidad del servicio, por favor contactar al equipo de <strong>Coordinación BV</strong>.</p>
    <div class="meta">
      Si tiene reportes pendientes guardados en su dispositivo, no podrán ser enviados.
    </div>
  </main>

  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
      } catch (e) {}

      try {
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (n) { caches.delete(n); });
          }).catch(function () {});
        }
      } catch (e) {}

      try {
        if (window.indexedDB && indexedDB.databases) {
          indexedDB.databases().then(function (dbs) {
            dbs.forEach(function (db) {
              if (db && db.name) {
                try { indexedDB.deleteDatabase(db.name); } catch (e) {}
              }
            });
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
